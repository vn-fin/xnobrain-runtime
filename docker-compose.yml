name: open-lumora

services:
  traefik:
    image: traefik:v3.5
    command:
      - --api.dashboard=false
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
    ports:
      - "${OPEN_LUMORA_HTTP_PORT:-80}:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - edge
    restart: unless-stopped

  studio:
    image: ${OPEN_LUMORA_IMAGE:-open-lumora-studio:local}
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      START_MODE: ${START_MODE:-local}
      HTTP_PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATA_DIR: /opt/data/open-lumora
      FRONTEND_DIR: /opt/open-lumora/frontend
      CONTROL_GATEWAY_URL: ${CONTROL_GATEWAY_URL:-http://enterprise-gateway:3100}
      HERMES_RUNTIME_TOKEN: ${HERMES_RUNTIME_TOKEN:-}
      NINE_ROUTER_DATA_DIR: /opt/data/.9router
      DEVICE_CLOUD_URL: ${DEVICE_CLOUD_URL:-}
      DEVICE_SIGNING_PUBLIC_KEY: ${DEVICE_SIGNING_PUBLIC_KEY:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_DISK_BUFFER_BYTES: ${OTEL_DISK_BUFFER_BYTES:-67108864}
      MAX_OPEN_SOURCE_AGENTS: 4
      MAX_OPEN_SOURCE_CRON_JOBS: 4
      MAX_OPEN_SOURCE_CRON_CONCURRENCY: 1
      MAX_OPEN_SOURCE_CRON_RUNS_PER_DAY: 10
      MAX_OPEN_SOURCE_CRON_RUNS_PER_MONTH: 200
      MAX_OPEN_SOURCE_PROVIDER_CONNECTIONS_PER_TYPE: 1
      MAX_OPEN_SOURCE_TEAMS: 1
      MAX_OPEN_SOURCE_AGENTS_PER_TEAM: 2
      MAX_OPEN_SOURCE_DELEGATED_WORKERS: 1
      MAX_OPEN_SOURCE_DELEGATION_DEPTH: 1
    volumes:
      - open_lumora_data:/opt/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.open-lumora.rule=Host(`${OPEN_LUMORA_DOMAIN:-localhost}`)
      - traefik.http.routers.open-lumora.entrypoints=web
      - traefik.http.services.open-lumora.loadbalancer.server.port=3000
    networks:
      - edge
      - control
    restart: unless-stopped

  enterprise-gateway:
    image: ${OPEN_LUMORA_ENTERPRISE_IMAGE:-open-lumora-enterprise-gateway:local}
    profiles: ["local"]
    environment:
      START_MODE: local
      HTTP_PORT: 3100
      DATA_DIR: /opt/open-lumora/data
      HERMES_RUNTIME_URL: http://runtime:8642
      HERMES_RUNTIME_TOKEN: ${HERMES_RUNTIME_TOKEN:-}
      NINE_ROUTER_URL: http://runtime:20128
    volumes:
      - gateway_data:/opt/open-lumora/data
    networks:
      - control
    restart: unless-stopped

  runtime:
    image: ${OPEN_LUMORA_HERMES_IMAGE:-open-lumora-hermes-runtime:local}
    profiles: ["local"]
    environment:
      HERMES_HOME: /opt/data/open-lumora/root
      HERMES_ROOT_PROFILE: /opt/data/open-lumora/root
      HERMES_PROFILES_ROOT: /opt/data/open-lumora/profiles
      NINE_ROUTER_DATA_DIR: /opt/data/.9router
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: 8642
      HERMES_RUNTIME_TOKEN: ${HERMES_RUNTIME_TOKEN:-}
    volumes:
      - open_lumora_data:/opt/data
    networks:
      - control
    restart: unless-stopped

networks:
  edge:
  control:
    internal: true

volumes:
  open_lumora_data:
  gateway_data:
