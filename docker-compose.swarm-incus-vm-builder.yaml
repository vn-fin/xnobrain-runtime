services:
  incus-vm-image-builder:
    image: ${incus_vm_builder:?incus_vm_builder image is required}
    user: "0:0"
    environment:
      INCUS_CONF: /tmp/incus
      RUN_ENV: ${RUN_ENV:?RUN_ENV is required}
      RUNTIME_VERSION: ${RUNTIME_VERSION:?RUNTIME_VERSION is required}
      RUNTIME_IMAGE_NAME: ${RUNTIME_IMAGE_NAME:-xnobrain-runtime}
      BRAIN4ALL_INCUS_PROJECT: ${INCUS_PROJECT:-default}
      BRAIN4ALL_INCUS_BUILDER: xnobrain-runtime-builder-${RUN_ENV}-${RUNTIME_VERSION}
      BRAIN4ALL_INCUS_IMAGE_ALIAS: ${RUNTIME_IMAGE_NAME:-xnobrain-runtime}-${RUN_ENV}-${RUNTIME_VERSION}
      BRAIN4ALL_INCUS_BUILD_ID: ${RUN_ENV}-${RUNTIME_VERSION}
      BRAIN4ALL_INCUS_BASE_IMAGE: ${RUNTIME_VM_BASE_IMAGE:-images:ubuntu/24.04/cloud}
      BRAIN4ALL_INCUS_TARGET: "{{.Node.Hostname}}"
      BRAIN4ALL_INCUS_IMAGE_DISK: ${RUNTIME_VM_IMAGE_DISK:-40GiB}
      BRAIN4ALL_INCUS_IMAGE_CPU: ${RUNTIME_VM_IMAGE_CPU:-4}
      BRAIN4ALL_INCUS_IMAGE_MEMORY: ${RUNTIME_VM_IMAGE_MEMORY:-8GiB}
      BRAIN4ALL_INCUS_HOLD_AFTER_BUILD: "1"
    volumes:
      - /var/lib/incus/unix.socket:/var/lib/incus/unix.socket
    healthcheck:
      disable: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 30s
        max_attempts: 3
        window: 10800s
      placement:
        constraints:
          - node.role == ${NODE_ROLE:-worker}
          - node.labels.incus == true
      labels:
        - "traefik.enable=false"
        - "xnobrain.component=incus-vm-image-builder"
        - "xnobrain.environment=${RUN_ENV}"
        - "xnobrain.runtime.version=${RUNTIME_VERSION}"
