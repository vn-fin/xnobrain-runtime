name: xnobrain

services:
  traefik:
    # v3.6.16 raises the provider floor to Docker API v1.40 for Engine 29+.
    image: traefik:v3.6.16
    command:
      - --api.dashboard=false
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=xnobrain_edge
      - --entrypoints.web.address=:5173
    ports:
      - "${XNOBRAIN_DEV_WEB_PORT:-5173}:5173"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - edge
    restart: unless-stopped

  runtime:
    image: ${XNOBRAIN_RUNTIME_IMAGE:-xnobrain-runtime:local}
    build:
      context: .
      dockerfile: Dockerfile.backend
    # The local assistant is intentionally root inside its own runtime
    # container so it can install requested office/system packages on demand.
    user: "0:0"
    cpus: ${XNOBRAIN_RUNTIME_CPUS:-4.0}
    mem_limit: ${XNOBRAIN_RUNTIME_MEMORY:-4G}
    memswap_limit: ${XNOBRAIN_RUNTIME_MEMORY:-4G}
    # Enforced when the Docker storage driver supports per-container quotas.
    storage_opt:
      size: ${XNOBRAIN_RUNTIME_DISK_SIZE:-100G}
    environment:
      RUNTIME_HERMES_HOME: ${RUNTIME_HERMES_HOME:?Set RUNTIME_HERMES_HOME in .env}
      RUNTIME_HERMES_ROOT_PROFILE: ${RUNTIME_HERMES_ROOT_PROFILE:-${RUNTIME_HERMES_HOME}}
      RUNTIME_HERMES_PROFILES_ROOT: ${RUNTIME_HERMES_PROFILES_ROOT:-${RUNTIME_HERMES_HOME}/profiles}
      RUNTIME_LLM_GATEWAY_URL: ${RUNTIME_LLM_GATEWAY_URL:?Set RUNTIME_LLM_GATEWAY_URL in .env}
      RUNTIME_LLM_MANAGEMENT_URL: ${RUNTIME_LLM_MANAGEMENT_URL:?Set RUNTIME_LLM_MANAGEMENT_URL in .env}
      RUNTIME_LLM_WORKLOAD_TOKEN: ${RUNTIME_LLM_WORKLOAD_TOKEN:?Set RUNTIME_LLM_WORKLOAD_TOKEN in .env}
      RUNTIME_HONCHO_MEMORY_ENABLE: ${RUNTIME_HONCHO_MEMORY_ENABLE:-false}
      RUNTIME_OTEL_TRACES_ENABLED: ${RUNTIME_OTEL_TRACES_ENABLED:-false}
      RUNTIME_SESSION_TIMEOUT_SECONDS: ${RUNTIME_SESSION_TIMEOUT_SECONDS:-86400}
      RUNTIME_DELEGATION_MAX_CONCURRENT_CHILDREN: ${RUNTIME_DELEGATION_MAX_CONCURRENT_CHILDREN:-3}
      RUNTIME_API_SERVER_HOST: 0.0.0.0
      RUNTIME_API_SERVER_PORT: 3000
      RUNTIME_DATA_DIR: /opt/data/xnobrain
      RUNTIME_DEVELOPMENT_ENVIRONMENT: ${RUNTIME_DEVELOPMENT_ENVIRONMENT:-development}
      RUNTIME_SERVICE_NAME: ${RUNTIME_SERVICE_NAME:-xnobrain-runtime-services}
      RUNTIME_OTEL_EXPORTER_OTLP_ENDPOINT: ${RUNTIME_OTEL_EXPORTER_OTLP_ENDPOINT:-}
    volumes:
      - xnobrain_data:/opt/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      - traefik.enable=true
      - traefik.http.routers.xnobrain-api.rule=Host(`${XNOBRAIN_DOMAIN:-localhost}`) && PathPrefix(`/xnobrain/api/runtime`)
      - traefik.http.routers.xnobrain-api.entrypoints=web
      - traefik.http.routers.xnobrain-api.priority=100
      - traefik.http.services.xnobrain-api.loadbalancer.server.port=3000
    networks:
      - edge
      - control
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/xnobrain/api/runtime/v1/health',timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.136.0
    profiles: ["otel"]
    user: "0:0"
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deploy/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    networks:
      - control
    restart: unless-stopped

networks:
  edge:
  control:
    internal: true

volumes:
  xnobrain_data:
    name: xnobrain_xnobrain_data
