name: open-lumora

services:
  traefik:
    # v3.6.16 raises the provider floor to Docker API v1.40 for Engine 29+.
    image: traefik:v3.6.16
    command:
      - --api.dashboard=false
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=open-lumora_edge
      - --entrypoints.web.address=:80
    ports:
      - "${OPEN_LUMORA_HTTP_PORT:-80}:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - edge
    restart: unless-stopped

  frontend:
    image: ${OPEN_LUMORA_FRONTEND_IMAGE:-open-lumora-frontend:local}
    build:
      context: .
      dockerfile: Dockerfile.frontend
    labels:
      - traefik.enable=true
      - traefik.http.routers.open-lumora-ui.rule=Host(`${OPEN_LUMORA_DOMAIN:-localhost}`)
      - traefik.http.routers.open-lumora-ui.entrypoints=web
      - traefik.http.routers.open-lumora-ui.priority=1
      - traefik.http.services.open-lumora-ui.loadbalancer.server.port=8080
    networks:
      - edge
    restart: unless-stopped

  runtime:
    image: ${HERMES_RUNTIME_IMAGE:-open-lumora-hermes-runtime:local}
    build:
      context: .
      dockerfile: Dockerfile.backend
    # The local assistant is intentionally root inside its own runtime
    # container so it can install requested office/system packages on demand.
    user: "0:0"
    cpus: ${OPEN_LUMORA_RUNTIME_CPUS:-4.0}
    mem_limit: ${OPEN_LUMORA_RUNTIME_MEMORY:-4G}
    memswap_limit: ${OPEN_LUMORA_RUNTIME_MEMORY:-4G}
    # Enforced when the Docker storage driver supports per-container quotas.
    storage_opt:
      size: ${OPEN_LUMORA_RUNTIME_DISK_SIZE:-100G}
    environment:
      HERMES_HOME: /opt/data/open-lumora/root
      HERMES_ROOT_PROFILE: /opt/data/open-lumora/root
      HERMES_PROFILES_ROOT: /opt/data/open-lumora/profiles
      HERMES_DESKTOP: "1"
      HOME: /root
      XDG_CONFIG_HOME: /root/.config
      NINE_ROUTER_DATA_DIR: /opt/data/.9router
      NINE_ROUTER_INTERNAL_SECRET: ${NINE_ROUTER_INTERNAL_SECRET:-open-lumora-local-9router}
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: 8642
      DATA_DIR: /opt/data/open-lumora
      START_MODE: ${START_MODE:-local}
      ENTERPRISE_API_URL: ${ENTERPRISE_API_URL:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    volumes:
      - open_lumora_data:/opt/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.open-lumora-api.rule=Host(`${OPEN_LUMORA_DOMAIN:-localhost}`) && (PathPrefix(`/api`) || PathPrefix(`/agent-gateway`) || PathPrefix(`/conversations`) || PathPrefix(`/sandboxes`) || PathPrefix(`/internal`) || PathPrefix(`/docs`) || Path(`/openapi.json`) || Path(`/redoc`))
      - traefik.http.routers.open-lumora-api.entrypoints=web
      - traefik.http.routers.open-lumora-api.priority=100
      - traefik.http.services.open-lumora-api.loadbalancer.server.port=8642
    networks:
      - edge
      - control
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8642/api/v1/health',timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.136.0
    profiles: ["authenticated"]
    user: "0:0"
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      TELEMETRY_RESOURCE_TOKEN: ${TELEMETRY_RESOURCE_TOKEN:-}
      ENTERPRISE_API_URL: ${ENTERPRISE_API_URL:-}
    volumes:
      - ./deploy/otel-collector.yaml:/etc/otelcol/config.yaml:ro
      - otel_collector_data:/var/lib/otelcol
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - control
    restart: unless-stopped

networks:
  edge:
  control:
    internal: true

volumes:
  open_lumora_data:
    name: open-lumora_open_lumora_data
  otel_collector_data:
