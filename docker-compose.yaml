name: xnobrain

x-honcho-environment: &honcho-environment
  DB_CONNECTION_URI: postgresql+psycopg://postgres:postgres@honcho-database:5432/postgres
  CACHE_URL: redis://honcho-redis:6379/0?suppress=true
  CACHE_ENABLED: "true"
  AUTH_USE_AUTH: "false"
  TELEMETRY_ENABLED: "false"
  EMBED_MESSAGES: "false"
  LLM_OPENAI_API_KEY: xnobrain-local-honcho
  DERIVER_MODEL_CONFIG__MODEL: auto
  DERIVER_MODEL_CONFIG__OVERRIDES__BASE_URL: http://runtime:20128/v1
  SUMMARY_MODEL_CONFIG__MODEL: auto
  SUMMARY_MODEL_CONFIG__OVERRIDES__BASE_URL: http://runtime:20128/v1
  DREAM_ENABLED: "false"
  DIALECTIC_LEVELS__minimal__MODEL_CONFIG__MODEL: auto
  DIALECTIC_LEVELS__minimal__MODEL_CONFIG__OVERRIDES__BASE_URL: http://runtime:20128/v1
  DIALECTIC_LEVELS__low__MODEL_CONFIG__MODEL: auto
  DIALECTIC_LEVELS__low__MODEL_CONFIG__OVERRIDES__BASE_URL: http://runtime:20128/v1
  DIALECTIC_LEVELS__medium__MODEL_CONFIG__MODEL: auto
  DIALECTIC_LEVELS__medium__MODEL_CONFIG__OVERRIDES__BASE_URL: http://runtime:20128/v1
  DIALECTIC_LEVELS__high__MODEL_CONFIG__MODEL: auto
  DIALECTIC_LEVELS__high__MODEL_CONFIG__OVERRIDES__BASE_URL: http://runtime:20128/v1
  DIALECTIC_LEVELS__max__MODEL_CONFIG__MODEL: auto
  DIALECTIC_LEVELS__max__MODEL_CONFIG__OVERRIDES__BASE_URL: http://runtime:20128/v1

services:
  traefik:
    # v3.6.16 raises the provider floor to Docker API v1.40 for Engine 29+.
    image: traefik:v3.6.16
    command:
      - --api.dashboard=false
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=xnobrain_edge
      - --entrypoints.web.address=:5152
    ports:
      - "${XNOBRAIN_HTTP_PORT:-5152}:5152"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - edge
    restart: unless-stopped

  runtime:
    image: ${XNOBRAIN_RUNTIME_IMAGE:-xnobrain-runtime:local}
    build:
      context: .
      dockerfile: Dockerfile.backend
    # The local assistant is intentionally root inside its own runtime
    # container so it can install requested office/system packages on demand.
    user: "0:0"
    cpus: ${XNOBRAIN_RUNTIME_CPUS:-4.0}
    mem_limit: ${XNOBRAIN_RUNTIME_MEMORY:-4G}
    memswap_limit: ${XNOBRAIN_RUNTIME_MEMORY:-4G}
    # Enforced when the Docker storage driver supports per-container quotas.
    storage_opt:
      size: ${XNOBRAIN_RUNTIME_DISK_SIZE:-100G}
    depends_on:
      honcho-api:
        condition: service_healthy
    environment:
      HERMES_DESKTOP: "1"
      HOME: /opt/data/home
      XDG_CONFIG_HOME: /opt/data/home/.config
      HERMES_HOME: ${XNOBRAIN_AGENT_HOME:?Set XNOBRAIN_AGENT_HOME in .env}
      HERMES_ROOT_PROFILE: ${XNOBRAIN_AGENT_HOME:?Set XNOBRAIN_AGENT_HOME in .env}
      HERMES_PROFILES_ROOT: ${XNOBRAIN_AGENT_PROFILES_ROOT:-}
      OMNIROUTE_DATA_DIR: ${XNOBRAIN_PROVIDER_DATA_DIR:?Set XNOBRAIN_PROVIDER_DATA_DIR in .env}
      OMNIROUTE_CLI_SALT: ${XNOBRAIN_PROVIDER_INTERNAL_SECRET:-omniroute-cli-auth-v1}
      HONCHO_MEMORY_ENABLE: ${HONCHO_MEMORY_ENABLE:-false}
      HONCHO_BASE_URL: http://honcho-api:8000
      HONCHO_ENVIRONMENT: local
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: 8642
      DATA_DIR: /opt/data/xnobrain
      DEVELOPMENT_ENVIRONMENT: ${DEVELOPMENT_ENVIRONMENT:-development}
      SERVICE_NAME: ${SERVICE_NAME:-xnobrain-runtime-services}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
    volumes:
      - xnobrain_data:/opt/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      - traefik.enable=true
      - traefik.http.routers.xnobrain-api.rule=Host(`${XNOBRAIN_DOMAIN:-localhost}`) && PathPrefix(`/xnobrain/api/runtime`)
      - traefik.http.routers.xnobrain-api.entrypoints=web
      - traefik.http.routers.xnobrain-api.priority=100
      - traefik.http.services.xnobrain-api.loadbalancer.server.port=8642
    networks:
      - edge
      - control
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8642/xnobrain/api/runtime/v1/health',timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  honcho-api:
    image: ghcr.io/plastic-labs/honcho@sha256:4feacec81be1356b44dca55a45198066189070593e4c62319184ffcd341ce641
    entrypoint: ["sh", "docker/entrypoint.sh"]
    environment: *honcho-environment
    depends_on:
      honcho-database:
        condition: service_healthy
      honcho-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - control
    restart: unless-stopped

  honcho-deriver:
    image: ghcr.io/plastic-labs/honcho@sha256:4feacec81be1356b44dca55a45198066189070593e4c62319184ffcd341ce641
    entrypoint: ["/app/.venv/bin/python", "-m", "src.deriver"]
    environment: *honcho-environment
    depends_on:
      honcho-api:
        condition: service_healthy
      runtime:
        condition: service_healthy
    networks:
      - control
    restart: unless-stopped

  honcho-database:
    image: pgvector/pgvector:pg15
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./runtime/honcho-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - honcho_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - control
    restart: unless-stopped

  honcho-redis:
    image: redis:8.2
    volumes:
      - honcho_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - control
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.136.0
    profiles: ["otel"]
    user: "0:0"
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deploy/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    networks:
      - control
    restart: unless-stopped

networks:
  edge:
  control:
    internal: true

volumes:
  xnobrain_data:
    name: xnobrain_xnobrain_data
  honcho_pgdata:
    name: xnobrain_honcho_pgdata
  honcho_redis_data:
    name: xnobrain_honcho_redis_data
