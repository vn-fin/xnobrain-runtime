name: brain4all

services:
  traefik:
    # v3.6.16 raises the provider floor to Docker API v1.40 for Engine 29+.
    image: traefik:v3.6.16
    command:
      - --api.dashboard=false
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=brain4all_edge
      - --entrypoints.web.address=:5152
    ports:
      - "${BRAIN4ALL_HTTP_PORT:-5152}:5152"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - edge
    restart: unless-stopped

  frontend:
    image: ${BRAIN4ALL_FRONTEND_IMAGE:-brain4all-frontend:local}
    build:
      context: .
      dockerfile: Dockerfile.frontend
    labels:
      - traefik.enable=true
      - traefik.http.routers.brain4all-ui.rule=Host(`${BRAIN4ALL_DOMAIN:-localhost}`)
      - traefik.http.routers.brain4all-ui.entrypoints=web
      - traefik.http.routers.brain4all-ui.priority=1
      - traefik.http.services.brain4all-ui.loadbalancer.server.port=8080
    networks:
      - edge
    restart: unless-stopped

  runtime:
    image: ${HERMES_RUNTIME_IMAGE:-brain4all-hermes-runtime:local}
    build:
      context: .
      dockerfile: Dockerfile.backend
    # The local assistant is intentionally root inside its own runtime
    # container so it can install requested office/system packages on demand.
    user: "0:0"
    cpus: ${BRAIN4ALL_RUNTIME_CPUS:-4.0}
    mem_limit: ${BRAIN4ALL_RUNTIME_MEMORY:-4G}
    memswap_limit: ${BRAIN4ALL_RUNTIME_MEMORY:-4G}
    # Enforced when the Docker storage driver supports per-container quotas.
    storage_opt:
      size: ${BRAIN4ALL_RUNTIME_DISK_SIZE:-100G}
    environment:
      HERMES_HOME: /opt/data/brain4all/root
      HERMES_ROOT_PROFILE: /opt/data/brain4all/root
      HERMES_PROFILES_ROOT: /opt/data/brain4all/profiles
      HERMES_DESKTOP: "1"
      HOME: /root
      XDG_CONFIG_HOME: /root/.config
      NINE_ROUTER_DATA_DIR: /opt/data/.9router
      NINE_ROUTER_INTERNAL_SECRET: ${NINE_ROUTER_INTERNAL_SECRET:-brain4all-local-9router}
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: 8642
      DATA_DIR: /opt/data/brain4all
      DEVELOPMENT_ENVIRONMENT: ${DEVELOPMENT_ENVIRONMENT:-dev}
      SERVICE_NAME: ${SERVICE_NAME:-runtime}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
    volumes:
      - brain4all_data:/opt/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      - traefik.enable=true
      - traefik.http.routers.brain4all-api.rule=Host(`${BRAIN4ALL_DOMAIN:-localhost}`) && (PathPrefix(`/api`) || PathPrefix(`/internal`))
      - traefik.http.routers.brain4all-api.entrypoints=web
      - traefik.http.routers.brain4all-api.priority=100
      - traefik.http.services.brain4all-api.loadbalancer.server.port=8642
    networks:
      - edge
      - control
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8642/api/brain/v1/health',timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.136.0
    profiles: ["otel"]
    user: "0:0"
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deploy/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    networks:
      - control
    restart: unless-stopped

networks:
  edge:
  control:
    internal: true

volumes:
  brain4all_data:
    name: brain4all_brain4all_data
