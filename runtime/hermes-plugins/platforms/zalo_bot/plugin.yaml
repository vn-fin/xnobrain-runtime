name: zalo_bot
label: Zalo Bot
kind: platform
version: 2.2.2
description: >
  Zalo Bot Platform gateway adapter for Hermes Agent.
  Connects to Zalo via the Bot API (bot.zaloplatforms.com) and relays
  messages between Zalo DMs and the Hermes agent. Supports long-polling
  (default) and webhook mode.

  Zero extra dependencies — uses httpx, already a Hermes Agent dependency.

  v2.0 adds: moderation slash commands (/menu, /warn, /silent...),
  a zero-token anti-spam + warn system, chat history storage, CRM contacts.
  The undocumented group-management API is removed (see VENDORED.md).
author: Moken
repository: "https://github.com/moken627-hub/hermes-plugin-zalo"
requires_env:
  - name: ZALO_BOT_TOKEN
    description: "Zalo Bot API token from bot.zaloplatforms.com (format: numeric_id:secret)"
    prompt: "Zalo Bot Token"
    url: "https://bot.zaloplatforms.com"
    password: true
optional_env:
  - name: ZALO_BOT_ALLOWED_USERS
    description: "Comma-separated Zalo user IDs allowed to talk to the bot (empty = all)"
    prompt: "Allowed users (comma-separated IDs)"
    password: false
  - name: ZALO_BOT_ALLOW_ALL_USERS
    description: "Allow any Zalo user to talk to the bot (true/false)"
    prompt: "Allow all users?"
    password: false
  - name: ZALO_BOT_DM_POLICY
    description: "Direct-message policy: disabled, allowlist, or pairing (default: pairing)"
    prompt: "DM policy"
    password: false
  - name: ZALO_BOT_HOME_CHANNEL
    description: "Default Zalo chat ID for cron / notification delivery"
    prompt: "Home channel chat ID"
    password: false
  - name: ZALO_BOT_HOME_CHANNEL_NAME
    description: "Display name for the Zalo home channel"
    prompt: "Home channel display name"
    password: false
  - name: ZALO_BOT_CRM_DIR
    description: "Directory for CRM contact data (default: ~/.hermes/zalo-bot-crm)"
    prompt: "CRM data directory"
    password: false
  - name: ZALO_BOT_CRM_DIR
    description: "Directory for CRM contact data (default: ~/.hermes/zalo-bot-crm)"
    prompt: "CRM data directory"
    password: false
  - name: ZALO_BOT_SETTINGS_DIR
    description: "Directory for per-group settings (default: ~/.hermes/zalo-bot-settings)"
    prompt: "Settings directory"
    password: false
