[tool.ruff]
target-version = "py311"
line-length = 100
src = ["xnobrain"]
extend-exclude = [
  ".tools",
  "app",
  "build",
  "dist",
  "xnobrain/ai/v1",
  "xnobrain/common/v1",
  "xnobrain/router/v1",
  "xnobrain/runtime/v1",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "I"]
extend-per-file-ignores = { "xnobrain/services/portability.py" = ["E402"] }
ignore = ["E501", "E731"]
