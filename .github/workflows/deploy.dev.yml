name: Publish XNOBrain Runtime — Dev

on:
  push:
    branches: [main]
    paths: [.version]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-xnobrain-runtime-dev
  cancel-in-progress: true

jobs:
  publish:
    uses: ./.github/workflows/publish-runtime-images.yml
    with:
      environment: dev
      node_role: worker
      frontend_build_args: |
        API_BASE_URL=https://public.dev.xno.vn
        API_CONTROL_BASE_URL=https://public.dev.xno.vn
        AUTH_BASE_URL=https://api.dev.xnoquant.io
        APP_NAME=XNOBrain
        APP_DESCRIPTION=Your private AI workspace for agents, conversations, skills, and automation.
        APP_EDITION=cloud
        AUTH_MODE=required
        AUTH_PROVIDER=xno-firebase
        FIREBASE_API_KEY=AIzaSyD8AFSR1vg21WOwLNVhczWfWfi3YSmZ9NA
    secrets:
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
