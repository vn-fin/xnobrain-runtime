name: Publish versioned XNOBrain runtime

on:
  workflow_call:
    inputs:
      environment:
        description: Runtime environment (dev, staging, or prod)
        required: true
        type: string
      node_role:
        description: Swarm role used by the Incus VM image builder
        required: false
        default: worker
        type: string
      frontend_build_args:
        description: Newline-separated frontend Docker build arguments
        required: true
        type: string
    secrets:
      GHCR_TOKEN:
        required: true

permissions:
  contents: read
  packages: write

jobs:
  version:
    name: Resolve runtime version
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Read and validate .version
        id: version
        run: |
          version="$(tr -d '[:space:]' < .version)"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "Invalid runtime version in .version: $version" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

  frontend:
    name: Build and publish frontend ${{ needs.version.outputs.value }}
    needs: version
    runs-on: [self-hosted, local, builder]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          build-args: ${{ inputs.frontend_build_args }}
          tags: |
            ghcr.io/${{ github.repository }}/xnobrain-frontend:${{ inputs.environment }}-${{ needs.version.outputs.value }}
            ghcr.io/${{ github.repository }}/xnobrain-frontend:${{ inputs.environment }}-latest

  vm_builder:
    name: Build and publish VM image builder ${{ needs.version.outputs.value }}
    needs: version
    runs-on: [self-hosted, local, builder]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push VM image builder
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.incus-vm-builder
          push: true
          tags: ghcr.io/${{ github.repository }}/incus-vm-builder:${{ inputs.environment }}-${{ needs.version.outputs.value }}

  deploy_vm_builder:
    name: Deploy Incus VM image builder ${{ inputs.environment }}-${{ needs.version.outputs.value }}
    needs: [version, vm_builder]
    runs-on: [self-hosted, "${{ inputs.environment }}"]
    timeout-minutes: 30
    env:
      RUN_ENV: ${{ inputs.environment }}
      NODE_ROLE: ${{ inputs.node_role }}
      RUNTIME_VERSION: ${{ needs.version.outputs.value }}
      RUNTIME_IMAGE_NAME: xnobrain-runtime
      incus_vm_builder: ghcr.io/${{ github.repository }}/incus-vm-builder:${{ inputs.environment }}-${{ needs.version.outputs.value }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Deploy versioned VM image builder
        run: |
          envsubst < docker-compose.swarm-incus-vm-builder.yaml \
            > docker-compose.swarm-incus-vm-builder.resolved.yaml
          docker stack deploy \
            -c docker-compose.swarm-incus-vm-builder.resolved.yaml \
            "xnobrain-runtime-${RUN_ENV}" \
            --with-registry-auth \
            --prune \
            --resolve-image never
